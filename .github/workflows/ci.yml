name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test:
    name: Test & Lint (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip build twine ruff pytest pytest-asyncio httpx "fakeredis[lua]>=2.20.0"
          pip install -e ".[dev]"

      - name: Lint with Ruff
        run: |
          ruff check .

      - name: Run Test Suite
        run: |
          pytest -v

      - name: Build Distribution Packages
        run: |
          python -m build

      - name: Validate Package Metadata
        run: |
          twine check dist/*

      - name: Verify Wheel Installation in Clean Environment
        run: |
          python -m venv test_env
          ./test_env/bin/pip install dist/*.whl
          ./test_env/bin/python -c "from unified_nexus import UnifiedNexus, ExposureMode, ToolSafetyLevel; print('Verified imports:', UnifiedNexus, ExposureMode, ToolSafetyLevel)"
